<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gracias por confiar en nosotros</title>
    <!-- Tailwind CSS para diseño minimalista -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-white text-black font-sans">

    <!-- Encabezado Minimalista -->
    <header class="py-12 px-4 text-center border-b-4 border-black">
        <h1 class="text-4xl md:text-6xl font-black uppercase tracking-tighter mb-4">¡Gracias por confiar en nosotros!</h1>
        <p class="text-xl md:text-2xl font-medium">Más de 20 pedidos entregados con éxito.</p>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-10">
        
        <!-- Collage de Fotos -->
        <section class="mb-12">
            <!-- Cuadrícula de 6 fotos (puedes agregar más copiando las líneas) -->
            <div class="grid grid-cols-2 md:grid-cols-3 gap-2">
                
                <!-- Foto 1 -->
                <img src="https://via.placeholder.com/500x500/000000/FFFFFF?text=Foto+1" alt="Pedido Entregado" class="w-full h-full object-cover border-2 border-black aspect-square">
                
                <!-- Foto 2 -->
                <img src="https://via.placeholder.com/500x500/000000/FFFFFF?text=Foto+2" alt="Pedido Entregado" class="w-full h-full object-cover border-2 border-black aspect-square">
                
                <!-- Foto 3 -->
                <img src="https://via.placeholder.com/500x500/000000/FFFFFF?text=Foto+3" alt="Pedido Entregado" class="w-full h-full object-cover border-2 border-black aspect-square">
                
                <!-- Foto 4 -->
                <img src="https://via.placeholder.com/500x500/000000/FFFFFF?text=Foto+4" alt="Pedido Entregado" class="w-full h-full object-cover border-2 border-black aspect-square">
                
                <!-- Foto 5 -->
                <img src="https://via.placeholder.com/500x500/000000/FFFFFF?text=Foto+5" alt="Pedido Entregado" class="w-full h-full object-cover border-2 border-black aspect-square">
                
                <!-- Foto 6 -->
                <img src="https://via.placeholder.com/500x500/000000/FFFFFF?text=Foto+6" alt="Pedido Entregado" class="w-full h-full object-cover border-2 border-black aspect-square">

            </div>
        </section>

        <!-- Botón de Contacto (Diseño B&N) -->
        <section class="text-center">
            <a href="https://wa.me/TUNUMERODEWHATSAPP" target="_blank" class="inline-flex items-center justify-center bg-black text-white hover:bg-gray-800 font-bold text-lg px-8 py-4 uppercase tracking-wide border-2 border-black transition-colors">
                <i class="fab fa-whatsapp text-2xl mr-3"></i> Contáctanos por WhatsApp
            </a>
        </section>

    </main>

    <footer class="text-center py-8 border-t-2 border-black font-bold uppercase text-sm">
        <p>100% Seguro y Confiable</p>
    </footer>

</body>
</html>
